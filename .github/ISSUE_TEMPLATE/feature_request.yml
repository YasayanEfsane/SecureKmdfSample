name: Feature request
description: Propose a focused improvement to the sample.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What limitation or use case should be addressed?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Explain the behavior and any ABI or security implications.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: invariants
    attributes:
      label: Security compatibility
      options:
        - label: The proposal preserves METHOD_BUFFERED and pointer-free packet handling.
        - label: The proposal changes the public protocol and includes a versioning plan.
